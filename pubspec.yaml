name: morphtext
description: >-
  Text that morphs letter by letter, outline into outline: weight, size, font,
  one word into another, or into an icon. Built on morphnext's outline engine.
version: 0.2.1
homepage: https://morphtext.drei.gg
repository: https://github.com/drei-gg/morphtext
issue_tracker: https://github.com/drei-gg/morphtext/issues
topics:
  - text
  - animation
  - morphing
  - typography
  - icons

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  # MorphText reads glyph outlines and pairs them through morphnext's public
  # glyph API (lib/src/engine.dart): 0.7.1 places glyphs without sampling
  # them again, and adds MorphFont.axes. The API is experimental until
  # morphnext 1.0 and may change in a minor release, so the range stops
  # before 0.8.
  morphnext: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
